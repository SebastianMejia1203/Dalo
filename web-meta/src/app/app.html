<div [class]="claseTexto()">
  <header class="cabecera">
    <button
      type="button"
      class="marca"
      (click)="dalo.mostrarComunicar()"
      aria-label="Daló: ir a Comunicar"
    >
      Daló.
    </button>
    <nav aria-label="Secciones">
      <button
        id="nav-comunicar"
        type="button"
        class="pildora"
        [class.activa]="dalo.vista() === 'comunicar'"
        [attr.aria-current]="dalo.vista() === 'comunicar' ? 'page' : null"
        (click)="dalo.mostrarComunicar()"
      >
        <i-lucide
          name="message-circle"
          [size]="18"
          aria-hidden="true"
        ></i-lucide>
        Comunicar
      </button>
      <button
        id="nav-expresiones"
        type="button"
        class="pildora"
        [class.activa]="dalo.vista() === 'expresiones'"
        [attr.aria-current]="dalo.vista() === 'expresiones' ? 'page' : null"
        (click)="dalo.mostrarExpresiones()"
      >
        <i-lucide name="book-open" [size]="18" aria-hidden="true"></i-lucide>
        Expresiones
      </button>
      <button
        id="nav-validacion"
        type="button"
        class="pildora"
        [class.activa]="dalo.vista() === 'admin'"
        [attr.aria-current]="dalo.vista() === 'admin' ? 'page' : null"
        (click)="dalo.abrirValidacion()"
      >
        <i-lucide
          name="shield-check"
          [size]="18"
          aria-hidden="true"
        ></i-lucide>
        Validación
      </button>
      <button
        id="nav-ajustes"
        type="button"
        class="pildora"
        [class.activa]="dalo.vista() === 'ajustes'"
        [attr.aria-current]="dalo.vista() === 'ajustes' ? 'page' : null"
        (click)="dalo.abrirAjustes()"
      >
        <i-lucide
          name="sliders-horizontal"
          [size]="18"
          aria-hidden="true"
        ></i-lucide>
        Ajustes
      </button>
    </nav>
  </header>

  <main>
    @if (dalo.vista() === 'comunicar') {
    <app-comunicador />
    } @else if (dalo.vista() === 'ajustes') {
    <app-ajustes />
    } @else if (dalo.vista() === 'admin') {
    <app-admin />
    }
    <!-- Expresiones se monta una sola vez y se oculta: así los avatares no
      se reconstruyen (ni muestran "Cargando") al entrar y salir. -->
    <app-expresiones
      [hidden]="dalo.vista() !== 'expresiones'"
      (elegir)="dalo.usarEnBuscador($event)"
    />
  </main>
</div>
